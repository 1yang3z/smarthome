{% extends "base.html" %}
{% block title %}历史曲线 - 智能家居{% endblock %}
{% block nav_history %}active{% endblock %}

{% block content %}
<h3 class="mb-4"><i class="bi bi-graph-up"></i> 历史数据曲线</h3>

<div class="card-custom mb-3">
    <div class="row align-items-center">
        <div class="col-auto">
            <label class="form-label mb-0">时间范围：</label>
        </div>
        <div class="col-auto">
            <select id="hoursSelect" class="form-select form-select-sm" onchange="loadHistory()">
                <option value="1">最近1小时</option>
                <option value="6">最近6小时</option>
                <option value="24" selected>最近24小时</option>
                <option value="72">最近3天</option>
                <option value="168">最近7天</option>
            </select>
        </div>
        <div class="col-auto">
            <button class="btn btn-sm btn-primary" onclick="loadHistory()">
                <i class="bi bi-arrow-repeat"></i> 刷新
            </button>
        </div>
    </div>
</div>

<!-- 温度曲线 -->
<div class="card-custom">
    <h5>🌡️ 温度变化趋势</h5>
    <div id="tempChart" style="height: 350px;"></div>
</div>

<!-- 湿度曲线 -->
<div class="card-custom">
    <h5>💧 湿度变化趋势</h5>
    <div id="humidChart" style="height: 350px;"></div>
</div>

<!-- 光照曲线 -->
<div class="card-custom">
    <h5>💡 光照变化趋势</h5>
    <div id="lightChart" style="height: 350px;"></div>
</div>
{% endblock %}

{% block extra_js %}
<script>
const tempChart = echarts.init(document.getElementById('tempChart'));
const humidChart = echarts.init(document.getElementById('humidChart'));
const lightChart = echarts.init(document.getElementById('lightChart'));

function loadHistory() {
    const hours = document.getElementById('hoursSelect').value;
    fetch(`/api/sensor/history?hours=${hours}&limit=500`)
        .then(r => r.json())
        .then(res => {
            const timestamps = res.data.map(d => d.timestamp);
            const temps = res.data.map(d => d.temperature);
            const humids = res.data.map(d => d.humidity);
            const lights = res.data.map(d => d.light);

            const commonOption = {
                tooltip: { trigger: 'axis' },
                grid: { left: 50, right: 30, top: 20, bottom: 40 },
                xAxis: {
                    type: 'category',
                    data: timestamps,
                    axisLabel: { rotate: 30, fontSize: 10 }
                },
                yAxis: { type: 'value' },
                dataZoom: [{ type: 'inside' }, { type: 'slider' }]
            };

            tempChart.setOption({
                ...commonOption,
                yAxis: { ...commonOption.yAxis, name: '温度 (°C)' },
                series: [{
                    data: temps,
                    type: 'line',
                    smooth: true,
                    lineStyle: { color: '#ff9800', width: 2 },
                    areaStyle: { color: 'rgba(255,152,0,0.1)' }
                }]
            });

            humidChart.setOption({
                ...commonOption,
                yAxis: { ...commonOption.yAxis, name: '湿度 (%)' },
                series: [{
                    data: humids,
                    type: 'line',
                    smooth: true,
                    lineStyle: { color: '#2196f3', width: 2 },
                    areaStyle: { color: 'rgba(33,150,243,0.1)' }
                }]
            });

            lightChart.setOption({
                ...commonOption,
                yAxis: { ...commonOption.yAxis, name: '光照 (lux)' },
                series: [{
                    data: lights,
                    type: 'line',
                    smooth: true,
                    lineStyle: { color: '#4caf50', width: 2 },
                    areaStyle: { color: 'rgba(76,175,80,0.1)' }
                }]
            });
        });
}

loadHistory();
</script>
{% endblock %}
