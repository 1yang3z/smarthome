{% extends "base.html" %}
{% block title %}仪表盘 - 智能家居{% endblock %}
{% block nav_index %}active{% endblock %}

{% block content %}
<h3 class="mb-4"><i class="bi bi-speedometer2"></i> 系统仪表盘</h3>

<!-- 统计卡片 -->
<div class="row" id="statCards">
    <div class="col-md-3">
        <div class="card-custom stat-card">
            <div class="icon text-warning"><i class="bi bi-thermometer-half"></i></div>
            <div class="value" id="tempValue">--°C</div>
            <div class="label">当前温度</div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card-custom stat-card">
            <div class="icon text-info"><i class="bi bi-droplet"></i></div>
            <div class="value" id="humidValue">--%</div>
            <div class="label">当前湿度</div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card-custom stat-card">
            <div class="icon text-success"><i class="bi bi-lightbulb"></i></div>
            <div class="value" id="lightValue">--lux</div>
            <div class="label">当前光照</div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card-custom stat-card">
            <div class="icon text-primary"><i class="bi bi-hdd-stack"></i></div>
            <div class="value" id="dataCount">--</div>
            <div class="label">今日数据量</div>
        </div>
    </div>
</div>

<!-- 系统状态 -->
<div class="row mt-3">
    <div class="col-md-6">
        <div class="card-custom">
            <h5><i class="bi bi-info-circle"></i> 系统状态</h5>
            <table class="table table-sm">
                <tr><td>MQTT 连接</td><td><span id="mqttStatus">检测中...</span></td></tr>
                <tr><td>服务器时间</td><td id="serverTime">--</td></tr>
                <tr><td>数据库</td><td>MySQL 8.0</td></tr>
                <tr><td>预测模型</td><td>随机森林</td></tr>
            </table>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card-custom">
            <h5><i class="bi bi-bell"></i> 最近告警</h5>
            <div id="recentAlerts">
                <p class="text-muted">加载中...</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
// 获取系统状态
fetch('/api/status')
    .then(r => r.json())
    .then(data => {
        document.getElementById('mqttStatus').innerHTML = data.mqtt_connected
            ? '<span class="status-dot online"></span>已连接'
            : '<span class="status-dot offline"></span>断开';
        document.getElementById('serverTime').textContent = data.server_time;
    });

// 获取最新传感器数据
function updateSensorData() {
    fetch('/api/sensor/latest')
        .then(r => r.json())
        .then(res => {
            if (res.data) {
                document.getElementById('tempValue').textContent = res.data.temperature + '°C';
                document.getElementById('humidValue').textContent = res.data.humidity + '%';
                document.getElementById('lightValue').textContent = (res.data.light || '--') + ' lux';
            }
        });
}

// 获取告警
fetch('/api/alerts?limit=5')
    .then(r => r.json())
    .then(res => {
        if (res.data.length === 0) {
            document.getElementById('recentAlerts').innerHTML = '<p class="text-success">✅ 暂无告警</p>';
        } else {
            let html = '<ul class="list-group list-group-flush">';
            res.data.forEach(a => {
                html += `<li class="list-group-item ${a.is_read ? '' : 'list-group-item-warning'}">
                    <small>${a.created_at}</small><br>${a.alert_message}</li>`;
            });
            html += '</ul>';
            document.getElementById('recentAlerts').innerHTML = html;
        }
    });

updateSensorData();
setInterval(updateSensorData, 5000);
</script>
{% endblock %}
